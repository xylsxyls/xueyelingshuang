; CookServer runtime config.
; Deploy by copying this file next to CookServer.exe.
; If CookServer.ini is missing beside the exe, CookServer uses built-in defaults.
; The copy in common/CookServer is the project default and documentation source.

[Server]
PublicIp=175.24.198.162
ListenHost=0.0.0.0
Port=5207
WorkerThreads=16
MaxRequestBytes=1048576
EnableCors=true
CorsAllowOrigin=*

[Storage]
; redis_mysql: MySQL is the durable source of truth, Redis is initialized from MySQL on startup and receives hot writes first.
; CookServer no longer reads or writes CookServerState.txt. Keep Redis and MySQL available before startup.
Backend=redis_mysql
RecipeResourceDirectoryName=res/recipes
VideoStorageDirectoryName=data/videos/files
SyncThreadCount=1
SyncTaskPriority=1

[Dependencies]
; CookServer startup checks MySQL/Redis process names first. If unavailable, it starts them in foreground console windows.
AutoStart=true
WaitTimeoutMilliseconds=30000
PollIntervalMilliseconds=500
StartupSettleMilliseconds=3000

[MySQL]
Host=127.0.0.1
Port=3306
User=root
Password=
Database=cook_server
AutoStart=true
Home=C:\mysql_cook-5.6.24-win32
ProcessName=mysqld.exe
StartCommand="{home}\bin\mysqld.exe" --defaults-file="{home}\my.ini" --basedir="{home}" --datadir="{home}\data" --console
WorkingDirectory={home}
PoolSize=4
AcquireTimeoutMilliseconds=3000
ConnectTimeoutSeconds=5
ReadTimeoutSeconds=10
WriteTimeoutSeconds=10

[Redis]
Host=127.0.0.1
Port=6379
Password=
DbIndex=0
PoolSize=4
KeyPrefix=cook
ConnectTimeoutMilliseconds=3000
CommandTimeoutMilliseconds=3000
EnableKeepAlive=true
AutoStart=true
Home=C:\redis_cook7.4.2
ProcessName=redis-server.exe
ConfigFile={home}\redis.conf
StartCommand="{home}\redis-server.exe" "{config}"
WorkingDirectory={home}

[Account]
DefaultCoins=0
DefaultYuanbao=100
MaxRechargeCoins=10000
AuthTokenExpireSeconds=604800
CheckinRewardCoins=5
AdRewardCoins=30
AdRequiredSeconds=30
MaxVideoBytes=104857600

[Feed]
DefaultCount=2
VideoSeenExpireDays=1
VideoStreamChunkBytes=4194304
VideoPosterApiPath=/api/videos/poster
VideoPosterGenerateEnabled=true
; First frame posters are generated through FFmpegCpp, not command-line ffmpeg.
VideoPosterCommandTemplate=
VideoPosterCommandUseShell=false
VideoPosterMaxWidth=720
VideoPosterMaxHeight=1280
VideoPosterJpegQuality=82
VideoPosterTimeoutMilliseconds=10000
VideoPosterApplyRotation=true
VideoPosterPrefetchCount=5
VideoPosterMemoryCacheMaxItems=100

[Voice]
; windows_sapi: use Windows local SAPI and cache wav files.
; command_mp3: run CommandTemplate and expect an mp3 file at {audioFile}.
; command_wav: run CommandTemplate and expect a wav file at {audioFile}.
; command: use CommandAudioFormat to decide mp3 or wav.
; disabled/none/off: disable server-side TTS.
; CommandTemplate placeholders: {textFile}, {audioFile}, {gender}, {format}, {text}.
; Prefer {textFile} over {text} for Chinese text to avoid command-line escaping issues.
TtsProvider=windows_sapi
CacheDirectoryName=data/voice/cache
AudioApiPath=/api/voice/audio
MaxTextBytes=2048
; When the client asks for inlineAudio=true, audio not larger than this limit is returned as base64 in /api/voice/tts.
; This is mainly for very short dynamic clips such as "34分15秒", avoiding a second downloadFile before playback.
InlineAudioMaxBytes=262144
; Number of server-side TTS worker threads. Jobs use priority through CTaskThreadManager.
WorkerThreadCount=8
CommandAudioFormat=mp3
CommandUseShell=false
; How many start-time prompt groups are treated as initial required voice.
; Example: rice + tomato egg uses two prompt groups, expanding to 淘米、启动煮饭、并且、打散鸡蛋.
InitialRequiredCount=2
InitialPromptGroupCount=2
; Mini program voice fetch concurrency and retry policy.
ClientConcurrency=2
FetchWaitMilliseconds=30000
FetchMaxAttempts=3
; CommandTemplate=D:\CookTts\cook_tts.exe --gender {gender} --text-file {textFile} --output {audioFile}

[Runtime]
MainLoopSleepMilliseconds=500
; A leave-kitchen rest block must be at least this long. Shorter waits are shown as kitchen watch time.
FreeBlockMinimumSeconds=120

[Log]
Path=
MaxFileBytes=104857600
MaxFileCount=5
CheckFileSizeInterval=100
OutputConsole=false
ArchiveOldLog=true